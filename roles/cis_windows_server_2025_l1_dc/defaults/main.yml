---
# Safety defaults: domain-wide account policy and User Rights are OFF until reviewed.
cis_apply_domain_account_policy: false
cis_apply_machine_registry: true
cis_apply_registry_removals: true
cis_apply_user_registry: false
cis_apply_user_rights: false
cis_apply_audit_policy: true
cis_apply_security_options: true
cis_apply_account_renames: false
cis_apply_logon_banner: false
cis_administrator_account_name: CIS-Administrator-CHANGE-ME
cis_guest_account_name: CIS-Guest-CHANGE-ME
cis_legal_notice_caption: Authorized Use Only
cis_legal_notice_text: This system is restricted to authorized users. Activities may be monitored and recorded.
cis_domain_password_history: 24
cis_domain_max_password_age_days: 365
cis_domain_min_password_age_days: 1
cis_domain_min_password_length: 14
cis_domain_complexity_enabled: true
cis_domain_reversible_encryption_enabled: false
cis_domain_lockout_duration_minutes: 15
cis_domain_lockout_threshold: 5
cis_domain_lockout_observation_window_minutes: 15

